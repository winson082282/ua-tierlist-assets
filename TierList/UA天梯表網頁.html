<div class="tier-list-container">
  <div class="filter-section is-expanded" id="filter-section">
    <div class="filter-header">
      <button
        type="button"
        id="toggle-filter-section"
        class="filter-toggle-btn"
        aria-expanded="true"
        aria-controls="filter-section-content"
      >
        <span class="toggle-title">篩選條件</span>
        <span class="toggle-state">收合</span>
        <span class="toggle-icon" aria-hidden="true">▾</span>
      </button>
      <button type="button" id="export-image-btn" class="export-btn">📸 匯出圖片</button>
    </div>
    <div id="filter-section-content" class="filter-content">
      <div class="filter-row">
        <div class="filter-item series-filter-item">
          <label for="series-filter" class="filter-title">系列篩選：</label>
          <div id="series-filter"></div>
        </div>
        <div class="filter-item color-filter-item">
          <label for="color-checkboxes" class="filter-title">顏色篩選：</label>
          <div id="color-checkboxes" class="color-filter-group">
            <label class="color-option">
              <input type="checkbox" value="黃" id="color_cb_黃">
              <span>黃🟡</span>
            </label>
            <label class="color-option">
              <input type="checkbox" value="紫" id="color_cb_紫">
              <span>紫🟣</span>
            </label>
            <label class="color-option">
              <input type="checkbox" value="藍" id="color_cb_藍">
              <span>藍🔵</span>
            </label>
            <label class="color-option">
              <input type="checkbox" value="綠" id="color_cb_綠">
              <span>綠🟢</span>
            </label>
            <label class="color-option">
              <input type="checkbox" value="紅" id="color_cb_紅">
              <span>紅🔴</span>
            </label>
            <button type="button" id="clear-color-filter" class="clear-filter-btn">清除顏色</button>
          </div>
        </div>
        <div class="filter-item sort-filter-item">
          <label class="filter-title">排序方式：</label>
          <div id="sort-radio-group" class="sort-filter-group">
            <label class="sort-option">
              <input type="radio" name="sort-mode" value="color" id="sort_radio_color" checked>
              <span>依顏色排序</span>
            </label>
            <label class="sort-option">
              <input type="radio" name="sort-mode" value="date" id="sort_radio_date">
              <span>依時間排序</span>
            </label>
            <label class="diff-priority-option">
              <input type="checkbox" id="diff-priority-checkbox" checked>
              <span>異動優先</span>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="filter-section-spacer" aria-hidden="true"></div>
  <br/>
  <div id="tier-rows-container" class="tier-rows"></div>
  <div class="loading-row">
    <div class="loader"></div>
    <div id="card-loading"></div>
  </div>
</div>

<!--引入 jQuery 與 Virtual Select 的 JS-->
<script src="https://cdn.jsdelivr.net/npm/virtual-select-plugin@1.0.45/dist/virtual-select.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/virtual-select-plugin@1.0.45/dist/virtual-select.min.css" rel="stylesheet" />

<!--引入 html2canvas，用於將天梯表匯出成圖片-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="./main.js"></script>
<link href="./style.css" rel="stylesheet" />
